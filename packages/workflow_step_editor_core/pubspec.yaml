name: workflow_step_editor_core
description: >-
  Pure-Dart core for the workflow step editor. Domain-free infrastructure:
  an immutable result type, a sealed error hierarchy, and a generic instance
  registry. Zero runtime dependencies — fully testable without Flutter.
version: 0.1.0
publish_to: 'none'

environment:
  # 3.2.0 is the first SDK with `sealed` / `final class`, which the error
  # hierarchy relies on. Keep this floor <= the UI package's floor.
  sdk: '>=3.2.0 <4.0.0'

# No runtime dependencies by design — the core stays pure Dart.

dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0
